plugins {
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_mc
        mappingsVersion = parchment_version
    }

    mods {
        create(mod_id) {
            sourceSet sourceSets.main
        }
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }
}

repositories {
    // 离线应急本地仓库（maven.neoforged.net 被阻断时手工镜像的 neoforge/neoform-runtime 构件）
    // 网络恢复后删除 D:/MinecraftModding/local-m2 目录即可自动失效
    if (file('D:/MinecraftModding/local-m2').exists()) {
        maven {
            name = 'LocalOfflineMirror'
            url = 'D:/MinecraftModding/local-m2'
        }
    }
    mavenCentral()
    maven {
        name = "Curios Maven"
        url = "https://maven.theillusivec4.top/"
    }
    flatDir {
        dirs "../icy_lib-NeoForge-1.21.1/build/libs"
    }
}

// 为本地镜像的 stub pom 补充 ModDevGradle 所需的 capability variants
//（真实仓库由 .module 元数据提供，stub pom 无法合成）
dependencies {
    components {
        withModule('net.neoforged:neoforge') {
            addVariant('moddevConfig') {
                withCapabilities {
                    removeCapability('net.neoforged', 'neoforge')
                    addCapability('net.neoforged', 'neoforge-moddev-config', '21.1.235')
                }
                withFiles {
                    addFile('neoforge-21.1.235-moddev-config.json')
                }
            }
            // 编译类路径需要 neoforge 类（universal.jar），userdev.jar 仅含 binpatches 无类
            addVariant('moddevBundle') {
                withCapabilities {
                    removeCapability('net.neoforged', 'neoforge')
                    addCapability('net.neoforged', 'neoforge-moddev-bundle', '21.1.235')
                }
                withFiles {
                    addFile('neoforge-21.1.235-universal.jar')
                }
            }
            // NFRT 的 --neoforge 参数指向 userdev，config 中的 universal 坐标也需要 universal.jar
            addVariant('neoforgeDependencies') {
                withCapabilities {
                    removeCapability('net.neoforged', 'neoforge')
                    addCapability('net.neoforged', 'neoforge-dependencies', '21.1.235')
                }
                withFiles {
                    addFile('neoforge-21.1.235-userdev.jar')
                    addFile('neoforge-21.1.235-universal.jar')
                }
            }
        }
        withModule('net.neoforged:neoform') {
            // neoform.module 中 neoformRuntimeElements 提供 neoform-dependencies capability，
            // 但缺少 net.neoforged.distribution=client attribute，补充以匹配 moddev 请求
            allVariants {
                attributes {
                    attribute(org.gradle.api.attributes.Attribute.of('net.neoforged.distribution', String), 'client')
                }
            }
        }
    }
}

